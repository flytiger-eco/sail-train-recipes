name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  docker-patches:
    name: Docker patch check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate build-time patches
        run: python -m unittest discover -s tests -v
