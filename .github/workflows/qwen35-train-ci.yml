name: Qwen3.5 cluster training CI

# These jobs are not run by GitHub runners. A cluster scheduler reads this
# declaration, pins it to a commit SHA, and launches the image on the training
# nodes: one container per node, the command run once per rank.
#
# Two jobs:
#
#  * qwen35-smoke runs best_practice/qwen3.5/internal/smoke.sh on one
#    8-GPU node: the proxy model (no checkpoint), multi-image mock data, THD
#    packing, context parallelism and vision CP, two training iterations. It is
#    the launcher the README publishes, so a green cell means the image still
#    starts, builds the HybridModel and trains. The image must be built from
#    dockers/Dockerfile.Qwen35 and pinned in the console var QWEN35_IMAGE;
#    HF_MODEL comes from the configured model root (QWEN35_MODEL_ROOT) and only
#    supplies the tokenizer.
#
#  * qwen35-varlen-cell keeps the variable-length SFT grid on its own image
#    (see the comment above that job).
#
# The image tags and the model roots are supplied by the scheduler
# configuration rather than this file: images are built and distributed on the
# nodes themselves (no registry), so the source commit of the image and the
# commit pinned here are independent; no machine-specific weight path is stored
# here.

on:
  workflow_dispatch:

jobs:
  qwen35-smoke:
    name: qwen35 smoke
    runs-on: k8s-runner-group-cpu-flytiger
    steps:
      - uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ vars.QWEN35_IMAGE }}
          nnodes: 1
          nproc_per_node: "8"
          timeout_minutes: 45
          source_dir: /workspace/source
          command: cd best_practice/qwen3.5 && bash internal/smoke.sh
          extra_env: HF_MODEL=${{ vars.QWEN35_MODEL_ROOT }}/Qwen3.5-2B
          # The training log plus meta/run.env and meta/cmd.txt land under
          # smoke_out/<tag>/ relative to the source checkout.
          artifact_paths: "*.log,*.json,*.env,*.txt"

  # Variable-length SFT (LLaVA-NeXT JSONL, THD packing) runs on a SEPARATE image
  # built from dockers/Dockerfile.Qwen35_varlen: a different Megatron-Bridge /
  # transformers / datasets / FLA stack that cannot coexist with the
  # Megatron-LM-for-sail image, so it gets its own job and its own console image
  # var QWEN35_IMAGE_VARLEN (image route C).
  #
  # The tune_varlen_*.sh scripts are the repository's standalone tuning entrypoints
  # (each sources no shared launcher). They read NPROC / RANK / LOG_DIR, while the
  # scheduler injects NPROC_PER_NODE / NODE_RANK. The command below bridges the two:
  #   NPROC=$NPROC_PER_NODE  RANK=$NODE_RANK  OUTPUT_DIR=LOG_DIR=./varlen_out
  # so the per-rank log lands at best_practice/qwen3.5/varlen_out/<tag>/train_node<RANK>.log
  # (collected by the *.log glob) and multi-node ranks are correct.
  #
  # The entrypoint selects the model by --model-size (recipe HF id from the model-root
  # cache) and loads SFT weights from PRETRAINED_CHECKPOINT; it does not read
  # HF_MODEL / NUM_IMAGES. DATA_DIR and the checkpoint root come from console vars
  # (QWEN35_VARLEN_DATA / QWEN35_VARLEN_CKPT_ROOT) plus the relative matrix ckpt_dir,
  # so no absolute dataset/weight path is stored here. hf_dir is kept only for the
  # matrix declaration shape; the varlen scripts do not consume it.
  # Profiling is left off: the standalone scripts capture via ENABLE_ASYS + prof.sh
  # (not the PROFILE=asys path), so profiling is left off here.
  qwen35-varlen-cell:
    name: qwen35 varlen ${{ matrix.cell }}
    runs-on: k8s-runner-group-cpu-flytiger
    strategy:
      matrix:
        include:
          - cell: varlen-2b-8k-sft
            tune: varlen_2b
            hf_dir: Qwen3.5-2B
            ckpt_dir: Qwen3.5-2B-fsdp-dtensor
            seq_len: 8192
            nodes: 1
            timeout: 45
          - cell: varlen-4b-8k-sft
            tune: varlen_4b
            hf_dir: Qwen3.5-4B
            ckpt_dir: Qwen3.5-4B-fsdp-dtensor
            seq_len: 8192
            nodes: 1
            timeout: 45
          - cell: varlen-9b-8k-sft
            tune: varlen_9b
            hf_dir: Qwen3.5-9B
            ckpt_dir: Qwen3.5-9B-fsdp-dtensor
            seq_len: 8192
            nodes: 1
            timeout: 45
          - cell: varlen-27b-8k-sft
            tune: varlen_27b
            hf_dir: Qwen3.5-27B
            ckpt_dir: Qwen3.5-27B-fsdp-dtensor
            seq_len: 8192
            nodes: 2
            timeout: 90
          - cell: varlen-35b-8k-sft
            tune: varlen_35b_a3b
            hf_dir: Qwen3.5-35B-A3B
            ckpt_dir: Qwen3.5-35B-A3B-fsdp_dtensor_ep16
            seq_len: 8192
            tp: 1
            ep: 16
            nodes: 2
            timeout: 90
    steps:
      - uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ vars.QWEN35_IMAGE_VARLEN }}
          nnodes: ${{ matrix.nodes }}
          nproc_per_node: "8"
          timeout_minutes: ${{ matrix.timeout }}
          source_dir: /workspace/source
          command: cd best_practice/qwen3.5 && NPROC=$NPROC_PER_NODE RANK=$NODE_RANK OUTPUT_DIR=./varlen_out LOG_DIR=./varlen_out bash tune_${{ matrix.tune }}.sh
          host_volumes: "${{ vars.QWEN35_VARLEN_DATA }}:${{ vars.QWEN35_VARLEN_DATA }},${{ vars.QWEN35_VARLEN_CKPT_ROOT }}:${{ vars.QWEN35_VARLEN_CKPT_ROOT }}"
          extra_env: DATA_DIR=${{ vars.QWEN35_VARLEN_DATA }},PRETRAINED_CHECKPOINT=${{ vars.QWEN35_VARLEN_CKPT_ROOT }}/${{ matrix.ckpt_dir }}
          artifact_paths: "*.log,*.pickle,*.json,*.json.gz,*.asysrep,*.env"
