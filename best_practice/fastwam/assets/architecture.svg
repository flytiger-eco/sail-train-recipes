<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="510" viewBox="0 0 1160 510" role="img">
<title>FastWAM训练与动作推理示意</title><desc>根据官方论文及当前FastWAM配置整理的概念示意，不是原论文图；推理不生成未来视频但仍迭代去噪动作</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#1e293b} .small{font-size:13px} .title{font-size:24px;font-weight:700}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="42" font-size="24" text-anchor="start">FastWAM · 保留训练期世界建模，省去推理期未来视频生成</text>
<text x="40" y="96" font-size="18" text-anchor="start">训练：视频与动作联合 Flow Matching；结构化 mask 限定信息依赖</text>
<rect x="40" y="118" width="240" height="82" rx="10" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="160.0" y="150" font-size="17" text-anchor="middle">多相机视频 → VAE</text>
<text x="160.0" y="177" font-size="13" text-anchor="middle">首帧条件 + 加噪未来 latent</text>
<rect x="355" y="118" width="330" height="82" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="520.0" y="150" font-size="17" text-anchor="middle">视频 DiT + ActionDiT（MoT）</text>
<text x="520.0" y="177" font-size="13" text-anchor="middle">30 层 / 分支；注意力 head_dim=128</text>
<rect x="760" y="118" width="340" height="82" rx="10" fill="#f5f3ff" stroke="#cbd5e1"/>
<text x="930.0" y="150" font-size="17" text-anchor="middle">视频 loss + 动作 loss</text>
<text x="930.0" y="177" font-size="13" text-anchor="middle">文本缓存与本体状态提供条件</text>
<line x1="285" y1="159" x2="347" y2="159" stroke="#475569" stroke-width="2"/>
<text x="308" y="152" font-size="21" text-anchor="start">→</text>
<line x1="690" y1="159" x2="752" y2="159" stroke="#475569" stroke-width="2"/>
<text x="713" y="152" font-size="21" text-anchor="start">→</text>
<text x="40" y="247" font-size="18" text-anchor="start">动作推理：只保留当前首帧，不生成未来视频</text>
<rect x="40" y="270" width="240" height="82" rx="10" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="160.0" y="302" font-size="17" text-anchor="middle">当前观测 → VAE</text>
<text x="160.0" y="329" font-size="13" text-anchor="middle">文本 + 本体状态</text>
<rect x="355" y="270" width="330" height="82" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="520.0" y="302" font-size="17" text-anchor="middle">视频骨干编码首帧一次</text>
<text x="520.0" y="329" font-size="13" text-anchor="middle">得到动作专家可复用的世界表征</text>
<rect x="760" y="270" width="340" height="82" rx="10" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="930.0" y="302" font-size="17" text-anchor="middle">动作专家迭代去噪</text>
<text x="930.0" y="329" font-size="13" text-anchor="middle">输出 action chunk（32 个动作）</text>
<line x1="285" y1="311" x2="347" y2="311" stroke="#475569" stroke-width="2"/>
<text x="308" y="304" font-size="21" text-anchor="start">→</text>
<line x1="690" y1="311" x2="752" y2="311" stroke="#475569" stroke-width="2"/>
<text x="713" y="304" font-size="21" text-anchor="start">→</text>
<text x="40" y="411" font-size="16" text-anchor="start">结构化依赖：首帧不读取未来；动作读取首帧和动作 token，不读取未来视频 token。</text>
<text x="40" y="443" font-size="15" text-anchor="start">“省去未来视频生成”不等于删除训练视频目标，也不等于动作生成只需一次前向。</text>
<text x="40" y="477" font-size="13" text-anchor="start">来源：Fast-WAM 论文 §3；configs/model/fastwam.yaml。本图为概念整理，非原论文图。</text>
</svg>
