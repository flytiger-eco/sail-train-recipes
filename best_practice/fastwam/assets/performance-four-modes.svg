<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="550" viewBox="0 0 1160 550" role="img">
<title>FastWAM：M890四模式训练性能</title><desc>LIBERO和RoboTwin独立H200基线；柱高是M890吞吐占H200的条件比值，不是任务成功率</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#1e293b} .small{font-size:13px} .title{font-size:24px;font-weight:700}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="42" font-size="24" text-anchor="start">FastWAM · Zhenwu M890 四模式训练性能</text>
<text x="40" y="70" font-size="15" text-anchor="start">柱高：M890 / H200（相同 global batch 时的吞吐比）；柱顶：M890 秒/step</text>
<text x="70" y="111" font-size="18" text-anchor="start">LIBERO  ·  H200 基线 0.929 秒/step</text>
<line x1="70" y1="405.0" x2="530" y2="405.0" stroke="#e2e8f0" />
<text x="58" y="410.0" font-size="13" text-anchor="end">0%</text>
<line x1="70" y1="336.25" x2="530" y2="336.25" stroke="#e2e8f0" />
<text x="58" y="341.25" font-size="13" text-anchor="end">20%</text>
<line x1="70" y1="267.5" x2="530" y2="267.5" stroke="#e2e8f0" />
<text x="58" y="272.5" font-size="13" text-anchor="end">40%</text>
<line x1="70" y1="198.75" x2="530" y2="198.75" stroke="#e2e8f0" />
<text x="58" y="203.75" font-size="13" text-anchor="end">60%</text>
<line x1="70" y1="130.0" x2="530" y2="130.0" stroke="#e2e8f0" />
<text x="58" y="135.0" font-size="13" text-anchor="end">80%</text>
<rect x="94" y="233.813" width="70" height="171.187" rx="5" fill="#64748b"/>
<text x="129" y="205.81250000000003" font-size="14" text-anchor="middle">1.8650s</text>
<text x="129" y="225.81250000000003" font-size="15" text-anchor="middle">49.8%</text>
<text x="129" y="434" font-size="14" text-anchor="middle">关闭</text>
<rect x="209" y="202.531" width="70" height="202.469" rx="5" fill="#2563eb"/>
<text x="244" y="174.53125" font-size="14" text-anchor="middle">1.5785s</text>
<text x="244" y="194.53125" font-size="15" text-anchor="middle">58.9%</text>
<text x="244" y="434" font-size="14" text-anchor="middle">EW</text>
<rect x="324" y="225.562" width="70" height="179.438" rx="5" fill="#7c3aed"/>
<text x="359" y="197.5625" font-size="14" text-anchor="middle">1.7794s</text>
<text x="359" y="217.5625" font-size="15" text-anchor="middle">52.2%</text>
<text x="359" y="434" font-size="14" text-anchor="middle">FFA</text>
<rect x="439" y="193.250" width="70" height="211.750" rx="5" fill="#0d9488"/>
<text x="474" y="165.25000000000003" font-size="14" text-anchor="middle">1.5083s</text>
<text x="474" y="185.25000000000003" font-size="15" text-anchor="middle">61.6%</text>
<text x="474" y="434" font-size="14" text-anchor="middle">EW + FFA</text>
<text x="70" y="469" font-size="13" text-anchor="start">EW 与 FFA 收益分别报告；不将组合收益全部归因于 FFA。</text>
<text x="640" y="111" font-size="18" text-anchor="start">RoboTwin  ·  H200 基线 1.1 秒/step</text>
<line x1="640" y1="405.0" x2="1100" y2="405.0" stroke="#e2e8f0" />
<text x="628" y="410.0" font-size="13" text-anchor="end">0%</text>
<line x1="640" y1="336.25" x2="1100" y2="336.25" stroke="#e2e8f0" />
<text x="628" y="341.25" font-size="13" text-anchor="end">20%</text>
<line x1="640" y1="267.5" x2="1100" y2="267.5" stroke="#e2e8f0" />
<text x="628" y="272.5" font-size="13" text-anchor="end">40%</text>
<line x1="640" y1="198.75" x2="1100" y2="198.75" stroke="#e2e8f0" />
<text x="628" y="203.75" font-size="13" text-anchor="end">60%</text>
<line x1="640" y1="130.0" x2="1100" y2="130.0" stroke="#e2e8f0" />
<text x="628" y="135.0" font-size="13" text-anchor="end">80%</text>
<rect x="664" y="238.281" width="70" height="166.719" rx="5" fill="#64748b"/>
<text x="699" y="210.28125" font-size="14" text-anchor="middle">2.2672s</text>
<text x="699" y="230.28125" font-size="15" text-anchor="middle">48.5%</text>
<text x="699" y="434" font-size="14" text-anchor="middle">关闭</text>
<rect x="779" y="209.750" width="70" height="195.250" rx="5" fill="#2563eb"/>
<text x="814" y="181.75000000000003" font-size="14" text-anchor="middle">1.9373s</text>
<text x="814" y="201.75000000000003" font-size="15" text-anchor="middle">56.8%</text>
<text x="814" y="434" font-size="14" text-anchor="middle">EW</text>
<rect x="894" y="228.312" width="70" height="176.688" rx="5" fill="#7c3aed"/>
<text x="929" y="200.3125" font-size="14" text-anchor="middle">2.1381s</text>
<text x="929" y="220.3125" font-size="15" text-anchor="middle">51.4%</text>
<text x="929" y="434" font-size="14" text-anchor="middle">FFA</text>
<rect x="1009" y="196.344" width="70" height="208.656" rx="5" fill="#0d9488"/>
<text x="1044" y="168.34375000000003" font-size="14" text-anchor="middle">1.8133s</text>
<text x="1044" y="188.34375000000003" font-size="15" text-anchor="middle">60.7%</text>
<text x="1044" y="434" font-size="14" text-anchor="middle">EW + FFA</text>
<text x="640" y="469" font-size="13" text-anchor="start">EW 与 FFA 收益分别报告；不将组合收益全部归因于 FFA。</text>
<text x="40" y="508" font-size="13" text-anchor="start">来源：LIBERO 用户表；RoboTwin 历史四模式 CSV。H200 配置尚未完整核对，跨平台比值仅作参考。</text>
</svg>
